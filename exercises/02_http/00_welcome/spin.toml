spin_manifest_version = 2

[application]
name = "spin-http-simple"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "spin-http-simple"

[component.spin-http-simple]
source = "../../../target/wasm32-wasip1/release/spin_http_simple.wasm"

[component.spin-http-simple.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]

[component.spin-http-simple.tool.spin-test]
source = "tests/target/wasm32-wasip1/release/tests.wasm"
